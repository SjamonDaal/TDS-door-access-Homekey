name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: backend
        run: |
          python -m unittest discover -s tests/controller -p 'test_*.py' -v
          python -m unittest discover -s tests/websocket -p 'test_*.py' -v

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/esp8266-pn532-websocket
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        # esptool (bundled by the espressif32 platform package) needs these
        # at run time for the ESP32 bootloader/partition build step; without
        # them it fails with "ModuleNotFoundError: No module named
        # 'intelhex'" (same fix as backend/Dockerfile's build image).
        run: python -m pip install platformio esptool
      - name: Create CI-only secrets file
        run: cp include/secrets.example.h include/secrets.h
      - name: Build standard firmware
        run: pio run -e websocket
      - name: Build diagnostic firmware
        run: pio run -e diagnostic
      - name: Build ArduinoOTA migration firmware
        env:
          HOMEKEY_OTA_AUTH: ci-build-token
        run: pio run -e ota
      - name: Build ESP32 firmware
        run: pio run -e esp32
      - name: Build ESP32 diagnostic firmware
        run: pio run -e esp32_diagnostic
      - name: Build ESP32 ArduinoOTA firmware
        env:
          HOMEKEY_OTA_AUTH: ci-build-token
        run: pio run -e esp32_ota
