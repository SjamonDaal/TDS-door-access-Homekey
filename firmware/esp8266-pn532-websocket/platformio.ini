[platformio]
default_envs = websocket

[env:websocket]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_speed = 57600
monitor_speed = 115200
lib_deps =
  links2004/WebSockets @ ^2.7.2
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

[env:diagnostic]
extends = env:websocket
build_flags =
  ${env:websocket.build_flags}
  -D SERIAL_DIAGNOSTICS=1

[env:ota]
extends = env:websocket
upload_protocol = espota
; Required by PlatformIO while resolving this environment; the command-line
; --upload-port supplied for a real reader overrides it.
upload_port = 127.0.0.1
upload_flags =
  --auth=${sysenv.HOMEKEY_OTA_AUTH}

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  links2004/WebSockets @ ^2.7.2
; Combines bootloader/partitions/app into one ${PROGNAME}-merged.bin flashable
; at 0x0, so the build output can be flashed with esptool.py alone.
extra_scripts =
  post:scripts/esp32_merge_bin.py

[env:esp32_diagnostic]
extends = env:esp32
build_flags =
  -D SERIAL_DIAGNOSTICS=1

[env:esp32_ota]
extends = env:esp32
upload_protocol = espota
; Required by PlatformIO while resolving this environment; the command-line
; --upload-port supplied for a real reader overrides it.
upload_port = 127.0.0.1
upload_flags =
  --auth=${sysenv.HOMEKEY_OTA_AUTH}
